<div class="admin-container">
  <!-- Sidebar Lateral -->
  <aside class="admin-sidebar">
    <div class="logo">Backoffice</div>
    <nav>
      <a routerLink="users" routerLinkActive="active">
        <mat-icon>people</mat-icon> Usuarios
      </a>
      <!-- Aquí agregarás Productos, Reportes, etc. en el futuro -->
      <a routerLink="products" routerLinkActive="active">
        <mat-icon>shopping_bag</mat-icon> Productos
      </a>
      <a routerLink="categories" routerLinkActive="active">
        <mat-icon>category</mat-icon> Categorías
      </a>
      <a routerLink="orders" routerLinkActive="active">
        <mat-icon>receipt_long</mat-icon> Órdenes
      </a>
    </nav>
  </aside>

  <!-- Contenido Principal -->
  <main class="admin-main">
    <header class="admin-header">
      <span>Panel de Control</span>
      <button (click)="logout()">Salir</button>
    </header>
    
    <section class="admin-content">
      <!-- AQUÍ se cargarán las rutas hijas (UserList, etc) -->
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
