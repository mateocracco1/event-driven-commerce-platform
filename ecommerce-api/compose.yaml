services:
  mysql:
    image: 'mysql:8.0.33'
    container_name: mysql-pp2
    environment:
      - MYSQL_DATABASE=${DB_NAME:-ppdb}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    ports:
      - '${DB_PORT:-3306}:3306'

  rabbitmq:
    image: 'rabbitmq:3-management'
    container_name: rabbitmq-pp2
    ports:
      - '5672:5672'    # Puerto AMQP para que Spring Boot envíe/reciba mensajes
      - '15672:15672'  # Panel web visual (Management UI)
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}