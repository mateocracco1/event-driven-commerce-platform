spring:
  application:
    name: ecommerce-api
  datasource:
    url: jdbc:mysql://localhost:3306/ppdb
    username: root
    password: ***REMOVED_DB_PASSWORD***
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ***REMOVED_MAIL_USERNAME***
    password: "***REMOVED_MAIL_PASSWORD***"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

ecommerce:
  app:
    jwtSecret: "***REMOVED_JWT_SECRET***"
    jwtExpirationMs: 86400000
    jwtCookieName: "ecommerce-token"